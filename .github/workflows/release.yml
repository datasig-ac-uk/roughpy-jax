name: release

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Choose whether to publish to PyPI or TestPyPI
        required: true
        default: publish
        type: choice
        options:
          - publish
          - testpypi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_main_wheels:
    name: Build wheels (${{ matrix.os }}${{ matrix.arch_name && format(', {0}', matrix.arch_name) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch_name: x86_64
          - os: windows-latest
            arch_name: AMD64
          - os: macos-14
            arch_name: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: pypa/cibuildwheel@v4.0.0
        env:
          CIBW_ARCHS_LINUX: auto64
          CIBW_ARCHS_WINDOWS: auto64
          CIBW_ARCHS_MACOS: native
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch_name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_cuda_plugin_wheels:
    name: Build plugin wheels (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs:
      - build_main_wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda12
            cibw_manylinux_image: quay.io/manylinux_cuda/manylinux_2_28_x86_64_cuda12_9:latest
          - variant: cuda13
            cibw_manylinux_image: quay.io/manylinux_cuda/manylinux_2_28_x86_64_cuda13_1:latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wheels-ubuntu-latest-x86_64
          path: .cibw-dist/main

      - name: Prepare plugin build tree
        run: python3 tools/prepare_cuda_plugin_build.py --variant "${{ matrix.variant }}"

      - name: Build plugin wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.cibw_manylinux_image }}
          CIBW_BEFORE_ALL_LINUX: >-
            bash tools/bootstrap_rough_path_primitives.sh
          CIBW_BEFORE_BUILD_LINUX: >-
            python -m pip install --upgrade /project/.cibw-dist/main/roughpy_jax-*.whl "jax>=0.4.0" "jaxlib>=0.4.0" "scikit-build-core[pyproject]>=0.10"
          CIBW_ENVIRONMENT_LINUX: >-
            CMAKE_PREFIX_PATH=/usr
            RPP_GIT_TAG=releases/1.0.2
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --exclude libcudart.so.12 --exclude libcudart.so.13 -w {dest_dir} {wheel}
          CIBW_TEST_SKIP: "*"
          RPP_GIT_TAG: main
        with:
          package-dir: build/cuda-plugin/${{ matrix.variant }}
          output-dir: wheelhouse/${{ matrix.variant }}

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-wheels-${{ matrix.variant }}
          path: wheelhouse/${{ matrix.variant }}/*.whl
          if-no-files-found: error


  publish_release:
    name: Publish release
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs:
      - build_sdist
      - build_main_wheels
      - build_cuda_plugin_wheels
    permissions:
      contents: write
      id-token: write
    environment:
      name: ${{ inputs.publish_target == 'testpypi' && 'testpypi' || 'pypi' }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install twine
        run: python -m pip install --upgrade pip twine

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Derive release version
        id: release_version
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name 'roughpy_jax-*.whl' | sort | head -n 1)"
          if [ -z "${wheel}" ]; then
            echo "No roughpy_jax wheel found in dist/" >&2
            exit 1
          fi

          version="$(printf '%s\n' "$(basename "${wheel}")" | cut -d- -f2)"
          printf 'tag=v%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Publish to PyPI
        if: inputs.publish_target == 'publish'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Publish to TestPyPI
        if: inputs.publish_target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/

      - name: Create GitHub release
        if: inputs.publish_target == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: gh release create "${RELEASE_TAG}" dist/* --generate-notes --target "${GITHUB_SHA}" --title "${RELEASE_TAG}"

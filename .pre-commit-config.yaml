repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]
        files: ^(common/include|roughpy_jax/src|platforms/[^/]+/src)/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx|cu|cuh)$

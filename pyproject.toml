[build-system]
requires = [
    "scikit-build-core[pyproject]>=1.0",
    "roughpy>=0.3.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "setuptools-scm>=9.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "roughpy-jax"
dynamic = ["version"]

description = "JAX bindings and operations for RoughPy"
readme = "README.md"
authors = [{ name = "The RoughPy Authors", email = "info@datasig.ac.uk" }]
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
keywords = ["rough-paths", "signatures", "jax", "streams"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = ["roughpy>=0.3.0", "jax>=0.4.0", "jaxlib>=0.4.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-benchmark", "ruff", "pre-commit", "ty", "hypothesis"]
lint = ["ruff", "pre-commit"]
typecheck = ["jax", "ty"]
jax = ["jax>=0.4.0", "jaxlib>=0.4.0"]
benchmarks = ["asv", "virtualenv", "psutil"]
"cuda12" = [
    "jax[cuda12]>=0.4.0; platform_system == 'Linux'",
    "roughpy-jax-cuda12-plugin; platform_system == 'Linux'",
]
"cuda13" = [
    "jax[cuda13]>=0.4.0; platform_system == 'Linux'",
    "roughpy-jax-cuda13-plugin; platform_system == 'Linux'",
]


[tool.scikit-build]
cmake.version = ">=3.30"
ninja.version = ">=1.11"
wheel.packages = ["roughpy_jax"]
wheel.exclude = [
    "roughpy_jax/tests/**",
    "roughpy_jax/src/**",
    "roughpy_jax/__pycache__/**",
    "roughpy_jax/**/*.pyc",
]
logging.level = "INFO"
cmake.build-type = "Release"
experimental = true
wheel.py-api = "cp311"
editable.mode = "inplace"


[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.cibuildwheel]
build = "cp311-*"
skip = [
    "*-musllinux_*",
    "*-manylinux_i686",
    "*-win32",
]
build-verbosity = 1
test-requires = ["pytest", "pytest-benchmark", "hypothesis"]
test-sources = ["roughpy_jax/tests"]
test-command = "pytest -c {project}/pyproject.toml -m \"not extra\" roughpy_jax/tests"

[tool.pytest.ini_options]
testpaths = ["roughpy_jax/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["extra: non-essential longer running tests, including jit tests"]


[tool.setuptools_scm]
local_scheme = "no-local-version"
